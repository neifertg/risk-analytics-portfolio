  <text x="210" y="232" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" fill="#6b7280">Systems accessed &#8594;</text>
  <text x="24" y="120" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" fill="#6b7280" transform="rotate(-90 24 120)">Session length &#8594;</text>

  <!-- Wider account population -->
  <g fill="#c7cbd1">
    <circle cx="95" cy="95" r="5"/>
