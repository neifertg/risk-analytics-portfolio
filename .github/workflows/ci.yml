name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  benfords-law-analyzer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: benfords-law-analyzer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python analyze.py

  duplicate-vendor-payment-checker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: duplicate-vendor-payment-checker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python generate_ledger.py
      - run: python check.py

  audit-rag-assistant:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: audit-rag-assistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      # No API keys in CI: this validates syntax only, not the live
      # embed/retrieve/generate pipeline (that needs paid Anthropic and
      # Voyage calls — exercised locally, see the project README).
      # node --check only validates its first file argument, so each
      # script needs its own invocation rather than one command with all
      # of them listed.
      - run: for f in scripts/*.mjs; do node --check "$f"; done
