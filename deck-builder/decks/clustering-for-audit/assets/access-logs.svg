<svg font-family="Inter, Segoe UI, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Illustrative scatter plot of accounts by systems accessed and average session length. Accounts in the same role cluster together, with other roles scattered around them. One account in that role reaches far more systems with longer sessions than its peers and is flagged for review.">
  <rect x="1" y="1" width="638" height="358" rx="14" fill="#ffffff" stroke="#e3e6eb" stroke-width="2"/>

  <text x="24" y="32" font-size="13" fill="#5b6270">Each dot is one account. Peers in the same role cluster together; one does not.</text>

  <!-- Axes -->
  <path d="M 64 60 V 300 H 400" fill="none" stroke="#9aa3b0" stroke-width="1.5"/>
  <text x="232" y="328" font-size="12" fill="#5b6270" text-anchor="middle">Systems accessed &#8594;</text>
  <text x="40" y="180" font-size="12" fill="#5b6270" text-anchor="middle" transform="rotate(-90 40 180)">Average session length &#8594;</text>

  <!-- Other roles: context only -->
  <g fill="#c3c8d0">
    <circle cx="110" cy="120" r="5"/><circle cx="250" cy="250" r="5"/><circle cx="300" cy="150" r="5"/>
    <circle cx="226" cy="160" r="5"/><circle cx="96" cy="190" r="5"/><circle cx="330" cy="236" r="5"/>
    <circle cx="86" cy="270" r="5"/><circle cx="276" cy="110" r="5"/><circle cx="196" cy="132" r="5"/>
    <circle cx="356" cy="196" r="5"/>
  </g>

  <!-- Same-role peers -->
  <g fill="#3a6ea5">
    <circle cx="130" cy="244" r="5"/><circle cx="148" cy="226" r="5"/><circle cx="140" cy="262" r="5"/>
    <circle cx="166" cy="238" r="5"/><circle cx="182" cy="220" r="5"/><circle cx="160" cy="206" r="5"/>
    <circle cx="190" cy="254" r="5"/><circle cx="176" cy="270" r="5"/><circle cx="122" cy="214" r="5"/>
    <circle cx="200" cy="236" r="5"/>
  </g>
  <text x="162" y="290" font-size="12" fill="#5b6270" text-anchor="middle">same-role peers</text>

  <!-- The account that doesn't match its peers -->
  <circle cx="352" cy="82" r="7" fill="#b4532a"/>
  <circle cx="352" cy="82" r="16" fill="none" stroke="#b4532a" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="330" y="78" font-size="12" fill="#5b6270" text-anchor="end">same role, far more</text>
  <text x="330" y="94" font-size="12" fill="#5b6270" text-anchor="end">systems and time</text>

  <!-- Result -->
  <text x="424" y="76" font-size="11" font-weight="600" fill="#5b6270" letter-spacing="0.8">RESULT</text>
  <circle cx="430" cy="108" r="5" fill="#3a6ea5"/>
  <text x="444" y="112" font-size="13" fill="#16191d">Same-role peers</text>
  <circle cx="430" cy="136" r="5" fill="#c3c8d0"/>
  <text x="444" y="140" font-size="13" fill="#16191d">Other roles</text>
  <circle cx="430" cy="164" r="5" fill="#b4532a"/>
  <text x="444" y="168" font-size="13" fill="#16191d">Outside its peer group</text>
  <line x1="424" y1="194" x2="616" y2="194" stroke="#e3e6eb" stroke-width="1.5"/>
  <path d="M 424 226 l 7 -12 l 7 12 z" fill="none" stroke="#16191d" stroke-width="1.8" stroke-linejoin="round"/>
  <line x1="431" y1="219" x2="431" y2="222" stroke="#16191d" stroke-width="1.8" stroke-linecap="round"/>
  <text x="446" y="226" font-size="13" font-weight="600" fill="#16191d">Flagged for review</text>
  <text x="424" y="248" font-size="12" fill="#5b6270">A lead to test, not a finding.</text>
  <text x="424" y="300" font-size="11" fill="#5b6270">Illustrative data</text>
</svg>
