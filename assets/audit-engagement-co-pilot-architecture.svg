<svg viewBox="0 0 860 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A question goes to a Sonnet supervisor, which dispatches to three scoped Haiku sub-agents (sampling, fraud-risk, standards), each calling only its own tools on a shared MCP server wrapping five shipped projects; the supervisor reconciles the sub-agents' answers into one synthesized, cited response.">
  <title>Audit Engagement Co-Pilot architecture</title>
  <rect x="0" y="0" width="860" height="400" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#33302c"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a8721c"/>
    </marker>
  </defs>

  <!-- Row 1: Question -> Supervisor -> Answer -->
  <rect x="20" y="28" width="150" height="54" rx="6" fill="#ffffff" stroke="#33302c" stroke-width="1.5"/>
  <text x="95" y="60" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f1c19">Question</text>

  <rect x="350" y="20" width="190" height="70" rx="6" fill="#ffffff" stroke="#a8721c" stroke-width="2"/>
  <text x="445" y="50" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f1c19">Supervisor</text>
  <text x="445" y="67" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#4a453f">Claude Sonnet</text>

  <rect x="670" y="28" width="170" height="54" rx="6" fill="#ffffff" stroke="#33302c" stroke-width="1.5"/>
  <text x="755" y="53" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f1c19">Synthesized,</text>
  <text x="755" y="68" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f1c19">cited answer</text>

  <line x1="170" y1="55" x2="344" y2="55" stroke="#33302c" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="540" y1="55" x2="664" y2="55" stroke="#a8721c" stroke-width="2" marker-end="url(#arrowAccent)"/>
  <text x="602" y="42" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#a8721c">reconciles disagreement</text>

  <!-- Row 2: three scoped sub-agents -->
  <rect x="190" y="170" width="150" height="60" rx="6" fill="#ffffff" stroke="#33302c" stroke-width="1.5"/>
  <text x="265" y="196" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1f1c19">Sampling</text>
  <text x="265" y="212" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#4a453f">Haiku</text>

  <rect x="385" y="170" width="150" height="60" rx="6" fill="#ffffff" stroke="#33302c" stroke-width="1.5"/>
  <text x="460" y="196" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1f1c19">Fraud-Risk</text>
  <text x="460" y="212" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#4a453f">Haiku</text>

  <rect x="580" y="170" width="150" height="60" rx="6" fill="#ffffff" stroke="#33302c" stroke-width="1.5"/>
  <text x="655" y="196" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1f1c19">Standards</text>
  <text x="655" y="212" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#4a453f">Haiku</text>

  <line x1="410" y1="90" x2="277" y2="164" stroke="#33302c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="300" y="130" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#4a453f">dispatch_sampling</text>

  <line x1="445" y1="90" x2="460" y2="164" stroke="#33302c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="500" y="130" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#4a453f">dispatch_fraud_risk</text>

  <line x1="480" y1="90" x2="643" y2="164" stroke="#33302c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="640" y="130" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#4a453f">dispatch_standards</text>

  <!-- Row 3: shared MCP server -->
  <rect x="220" y="300" width="470" height="64" rx="6" fill="#ffffff" stroke="#33302c" stroke-width="1.5"/>
  <text x="455" y="326" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f1c19">MCP Server — 7 tools</text>
  <text x="455" y="344" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#4a453f">wraps 5 already-shipped portfolio projects</text>

  <line x1="270" y1="230" x2="330" y2="296" stroke="#33302c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="460" y1="230" x2="458" y2="296" stroke="#33302c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="650" y1="230" x2="590" y2="296" stroke="#33302c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="455" y="286" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#4a453f">each scoped to only its own tools</text>
</svg>
