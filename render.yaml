# Render Blueprint for the Audit Engagement Co-Pilot's deployment (Phase 5,
# see Seth_Wiki/projects/audit-engagement-co-pilot.md). Connecting this repo
# to Render as a Blueprint pre-fills the service config below instead of
# clicking through the "New Web Service" form by hand -- the two secret
# values still have to be entered manually in the Render dashboard
# (`sync: false` means "not stored in this file", deliberately, since
# secrets never belong in a committed file).
services:
  - type: web
    name: audit-engagement-co-pilot
    runtime: docker
    plan: free
    dockerfilePath: ./audit-engagement-co-pilot/Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: VOYAGE_API_KEY
        sync: false
