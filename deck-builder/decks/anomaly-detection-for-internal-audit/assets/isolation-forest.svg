<svg font-family="Inter, Segoe UI, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="The same crowd of travelers is cut at random until one traveler stands alone. Isolating an ordinary traveler inside the crowd takes six cuts, so it is cleared. Isolating the unusual traveler off to the side takes only two cuts, so it is flagged for review.">
  <rect x="1" y="1" width="638" height="358" rx="14" fill="#ffffff" stroke="#e3e6eb" stroke-width="2"/>

  <defs>
    <g id="t">
      <circle cx="0" cy="-9" r="5"/>
      <path d="M -8 10 Q 0 -5 8 10 Z"/>
    </g>
    <!-- One shared scene: the crowd plus the unusual traveler, in panel coordinates (284 x 210) -->
    <g id="crowd" fill="#3a6ea5">
      <use href="#t" x="48" y="115"/>
      <use href="#t" x="84" y="100"/>
      <use href="#t" x="128" y="116"/>
      <use href="#t" x="160" y="102"/>
      <use href="#t" x="50" y="150"/>
      <use href="#t" x="98" y="146"/>
      <use href="#t" x="140" y="155"/>
      <use href="#t" x="80" y="186"/>
      <use href="#t" x="124" y="188"/>
    </g>
    <g id="panel">
      <rect x="0" y="0" width="284" height="210" rx="8" fill="#ffffff" stroke="#e3e6eb" stroke-width="1.5"/>
    </g>
  </defs>

  <text x="24" y="32" font-size="13" fill="#5b6270">Random cuts split the data until a traveler stands alone. The fewer cuts it takes, the more unusual.</text>

  <g font-size="11" font-weight="600" fill="#5b6270" letter-spacing="0.8">
    <text x="24" y="66">ISOLATING AN ORDINARY TRAVELER</text>
    <text x="332" y="66">ISOLATING THE UNUSUAL TRAVELER</text>
  </g>

  <!-- Left panel: an ordinary traveler, buried in the crowd, needs six cuts -->
  <g transform="translate(24 78)">
    <use href="#panel"/>
    <rect x="73" y="124" width="41" height="38" fill="#e9eff7"/>
    <g stroke="#9aa3b0" stroke-width="1.5" stroke-dasharray="5 4">
      <line x1="196" y1="0" x2="196" y2="210"/>
      <line x1="0" y1="72" x2="196" y2="72"/>
      <line x1="73" y1="72" x2="73" y2="210"/>
      <line x1="114" y1="72" x2="114" y2="210"/>
      <line x1="73" y1="124" x2="114" y2="124"/>
      <line x1="73" y1="162" x2="114" y2="162"/>
    </g>
    <g font-size="10" font-weight="600" fill="#5b6270" text-anchor="middle">
      <text x="204" y="14">1</text>
      <text x="8" y="66">2</text>
      <text x="66" y="86">3</text>
      <text x="121" y="86">4</text>
      <text x="66" y="128">5</text>
      <text x="66" y="166">6</text>
    </g>
    <use href="#crowd"/>
    <g fill="#b4532a"><use href="#t" x="240" y="48"/></g>
  </g>

  <!-- Right panel: the unusual traveler, off on its own, needs two cuts -->
  <g transform="translate(332 78)">
    <use href="#panel"/>
    <path d="M 197 1 H 276 A 7 7 0 0 1 283 8 V 83 H 197 Z" fill="#f7ebe5"/>
    <g stroke="#9aa3b0" stroke-width="1.5" stroke-dasharray="5 4">
      <line x1="196" y1="0" x2="196" y2="210"/>
      <line x1="196" y1="84" x2="284" y2="84"/>
    </g>
    <g font-size="10" font-weight="600" fill="#5b6270" text-anchor="middle">
      <text x="188" y="14">1</text>
      <text x="276" y="100">2</text>
    </g>
    <use href="#crowd"/>
    <g fill="#b4532a"><use href="#t" x="240" y="48"/></g>
  </g>

  <!-- Outcomes -->
  <text x="24" y="320" font-size="13" fill="#5b6270">Takes 6 cuts</text>
  <path d="M 150 315 l 5 5 l 9 -10" fill="none" stroke="#16191d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="170" y="320" font-size="13" font-weight="600" fill="#16191d">Cleared</text>

  <text x="332" y="320" font-size="13" fill="#5b6270">Takes 2 cuts</text>
  <path d="M 450 320 l 7 -12 l 7 12 z" fill="none" stroke="#16191d" stroke-width="1.8" stroke-linejoin="round"/>
  <line x1="457" y1="313" x2="457" y2="316" stroke="#16191d" stroke-width="1.8" stroke-linecap="round"/>
  <text x="470" y="320" font-size="13" font-weight="600" fill="#16191d">Flagged for review</text>
</svg>
