title: Risk & Audit Analytics Portfolio
theme: jekyll-theme-minimal
markdown: kramdown

# audit-rag-assistant/ is a runnable Node/Python project living alongside
# this Jekyll site, not site content — exclude its build artifacts so a
# GitHub Pages build doesn't try to process/copy them. The project's own
# corpus/scripts/app/README files are plain markdown and Jekyll will just
# render them as pages if not excluded too, which isn't the intent here.
exclude:
  - audit-rag-assistant/node_modules
  - audit-rag-assistant/index
  - audit-rag-assistant/logs
  - audit-rag-assistant/app/.venv
  - audit-rag-assistant/corpus
  - audit-rag-assistant/scripts
  - audit-rag-assistant/evals
  - audit-rag-assistant/app
  - audit-rag-assistant/README.md
  - audit-rag-assistant/package.json
  - audit-rag-assistant/package-lock.json
  - audit-rag-assistant/.gitignore
  - benfords-law-analyzer/.venv
  - benfords-law-analyzer/output
  - benfords-law-analyzer/analyze.py
  - benfords-law-analyzer/README.md
  - benfords-law-analyzer/requirements.txt
  - benfords-law-analyzer/.gitignore
  - duplicate-vendor-payment-checker/.venv
  - duplicate-vendor-payment-checker/data
  - duplicate-vendor-payment-checker/output
  - duplicate-vendor-payment-checker/generate_ledger.py
  - duplicate-vendor-payment-checker/check.py
  - duplicate-vendor-payment-checker/README.md
  - duplicate-vendor-payment-checker/requirements.txt
  - duplicate-vendor-payment-checker/.gitignore
  # deck-builder/decks/clustering-for-audit/index.html and its assets/ are
  # deliberately NOT excluded — that's a self-contained static HTML file
  # (SVGs inlined as base64, reveal.js from CDN) meant to be served live by
  # GitHub Pages as a clickable demo, unlike the other three projects' code.
  - deck-builder/node_modules
  - deck-builder/scripts
  - deck-builder/layouts
  - deck-builder/brand
  - deck-builder/PATTERN.md
  - deck-builder/README.md
  - deck-builder/package.json
  - deck-builder/package-lock.json
  - deck-builder/decks/clustering-for-audit/deck.yaml
  - deck-builder/.gitignore
  - journal-entry-testing-analyzer/.venv
  - journal-entry-testing-analyzer/data
  - journal-entry-testing-analyzer/output
  - journal-entry-testing-analyzer/generate_journal_entries.py
  - journal-entry-testing-analyzer/check.py
  - journal-entry-testing-analyzer/README.md
  - journal-entry-testing-analyzer/requirements.txt
  - journal-entry-testing-analyzer/.gitignore
  - sod-conflict-checker/.venv
  - sod-conflict-checker/data
  - sod-conflict-checker/output
  - sod-conflict-checker/generate_access_data.py
  - sod-conflict-checker/check.py
  - sod-conflict-checker/README.md
  - sod-conflict-checker/requirements.txt
  - sod-conflict-checker/.gitignore
