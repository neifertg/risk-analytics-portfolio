<svg font-family="Inter, Segoe UI, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Six guests merge into a tree: the closest pairs merge first, then pairs merge into larger circles. Cutting the tree low gives three groups; cutting it higher gives two. The tree is the same either way, so the number of groups is decided after seeing it.">
  <rect x="1" y="1" width="638" height="358" rx="14" fill="#ffffff" stroke="#e3e6eb" stroke-width="2"/>

  <defs>
    <g id="t">
      <circle cx="0" cy="-9" r="5"/>
      <path d="M -8 10 Q 0 -5 8 10 Z"/>
    </g>
  </defs>

  <text x="24" y="32" font-size="13" fill="#5b6270">The closest guests merge first, then circles merge into bigger circles. You choose where to cut.</text>
  <text x="24" y="70" font-size="11" fill="#5b6270">Higher merge = less alike</text>

  <!-- The merge tree -->
  <g fill="none" stroke="#9aa3b0" stroke-width="2">
    <path d="M 60 284 V 250 H 120 V 284"/>
    <path d="M 210 284 V 236 H 270 V 284"/>
    <path d="M 380 284 V 214 H 450 V 284"/>
    <path d="M 90 250 V 160 H 240 V 236"/>
    <path d="M 165 160 V 104 H 415 V 214"/>
    <path d="M 290 104 V 90"/>
  </g>

  <!-- Two possible cuts -->
  <g stroke="#5b6270" stroke-width="1.5" stroke-dasharray="5 4">
    <line x1="30" y1="188" x2="474" y2="188"/>
    <line x1="30" y1="132" x2="474" y2="132"/>
  </g>
  <g fill="#3a6ea5">
    <circle cx="90" cy="188" r="4"/><circle cx="240" cy="188" r="4"/><circle cx="415" cy="188" r="4"/>
    <circle cx="165" cy="132" r="4"/><circle cx="415" cy="132" r="4"/>
  </g>
  <text x="490" y="136" font-size="13" font-weight="600" fill="#16191d">Cut high: 2 groups</text>
  <text x="490" y="192" font-size="13" font-weight="600" fill="#16191d">Cut low: 3 groups</text>
  <text x="490" y="232" font-size="12" fill="#5b6270">Same tree either way.</text>
  <text x="490" y="249" font-size="12" fill="#5b6270">You pick the count</text>
  <text x="490" y="266" font-size="12" fill="#5b6270">after you see it.</text>

  <!-- Guests (leaves) -->
  <g fill="#3a6ea5">
    <use href="#t" x="60" y="304"/><use href="#t" x="120" y="304"/>
    <use href="#t" x="210" y="304"/><use href="#t" x="270" y="304"/>
    <use href="#t" x="380" y="304"/><use href="#t" x="450" y="304"/>
  </g>

  <!-- Groups from the low cut -->
  <g stroke="#9aa3b0" stroke-width="1.5" fill="none">
    <path d="M 48 322 v 6 h 84 v -6"/>
    <path d="M 198 322 v 6 h 84 v -6"/>
    <path d="M 368 322 v 6 h 94 v -6"/>
  </g>
  <g font-size="12" fill="#5b6270" text-anchor="middle">
    <text x="90" y="346">Group 1</text>
    <text x="240" y="346">Group 2</text>
    <text x="415" y="346">Group 3</text>
  </g>
</svg>
